<main class="flex items-center justify-center">
    <div class="p-4 w-full max-w-md h-[100vh] flex flex-col justify-between">
    @if(jugadorActualIndex() < jugadores().length) {
        <app-player-reveal
        [jugador]="jugadores()[jugadorActualIndex()]"
        [palabra]="palabra()"
        [textoBoton]="jugadorActualIndex() < jugadores().length - 1 ? 'Siguiente Jugador' : 'Empezar Partida'"
        (onNextPlayer)="siguienteJugador()"
        />
        
        <!-- Botones adicionales -->
         <div>
             <button 
             (click)="cambiarPalabra()"
             class="w-full rounded-lg bg-indigo-700 text-gray-100 px-4 py-2 mt-4"
             >
             Cambiar Palabra
             </button>
             
             <button 
             (click)="volverAlMenu()"
             class="w-full rounded-lg bg-indigo-700 text-gray-100 px-4 py-2 mt-4"
             >
             Volver al Menú
             </button>
         </div>
    } @else {
        @if(!partidaFinalizada()) {
            <app-game-timer
                [tiempoFormateado]="tiempoFormateado"
                [primerJugador]="jugadores()[0].nombre"
                (onEndGame)="terminarPartida()"
            />
        } @else {
            <app-game-end
                [tiempoFinal]="tiempoFormateado"
                (onPlayAgain)="volverAJugar()"
                (onBackToMenu)="volverAlMenu()"
                [impostores]="impostoresNombres()"
            />
        }
    }
    </div>
</main>
