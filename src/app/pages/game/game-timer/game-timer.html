<div class="bg-indigo-700 rounded-lg shadow-2xl p-8 text-center">
    <h2 class="text-white text-3xl font-bold mb-4">¡Que comience el juego!</h2>
    <p class="text-white text-lg mb-6">Empieza <span class="text-indigo-950 font-bold">{{primerJugador}}</span></p>
    
    <!-- Temporizador -->
    <div class="bg-white rounded-lg p-6 mb-6">
    <p class="text-gray-600 text-sm mb-2">Tiempo transcurrido</p>
    <div class="text-6xl font-bold text-indigo-700 font-mono">
        {{ tiempoFormateado }}
    </div>
    </div>
    
    <button 
    (click)="onEndGame.emit()"
    class="bg-indigo-950 text-gray-100 font-bold py-3 px-8 rounded-lg"
    >
    Terminar Partida
    </button>
</div>
