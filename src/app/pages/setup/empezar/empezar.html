<main class="text-center mt-10">
  <div>
      <p>Categoria: {{ categoria || 'Sin Categoría' }}</p>
      <p>Jugadores: {{ jugadores || 0 }}</p>
      <p>Impostores: {{ impostores || 0 }}</p>
  </div>

  <button
    [disabled]="categoria === '' || jugadores == null || impostores == null"
    routerLink="/game"
    class="
      mt-6 px-4 py-2 rounded-2xl
      text-gray-100
      active:rounded-2xl bg-purple-600 text-gray-100 px-4 py-2 active:bg-purple-600

      disabled:opacity-50
      disabled:cursor-not-allowed
      disabled:bg-gray-500
      disabled:border-gray-500
    "
  >
    Empezar Partida
  </button>

</main>
