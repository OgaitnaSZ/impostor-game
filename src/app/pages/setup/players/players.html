<section class="text-center mt-10 flex flex-col">
    <h2 class="text-2xl">Jugadores</h2>
    <p class="text-sm text-gray-600">(De 3 a 10)</p>
    <article class="mt-4 flex flex-col gap-4">
        @for(player of players ; track $index){
            <div class="flex w-full">
                <input (change)="actualizarJugadores()" type="text" class="border-indigo-700 border-b flex-1" [(ngModel)]="players[$index].nombre">
                <button (click)="eliminarJugador($index)" class="text-red-500 text-2xl ms-2">
                    x
                </button>
            </div>
        }
    </article>
    <button (click)="agregarJugador(`Jugador ${players.length + 1}`)" class="mt-4 rounded-lg bg-indigo-700 text-gray-100 px-4 py-2 active:bg-indigo-700">
        + Agregar Jugador
    </button>
</section>
