<main class="text-center mt-10 flex flex-col justify-center items-center">
    <section>
        <h2 class="text-2xl">Jugadores</h2>
        <p class="text-sm text-gray-600">(De 3 a 10)</p>
        <article class="mt-5 flex flex-col justify-center items-center">
            @for(player of players ; track $index){
                <div>
                    <input (change)="actualizarJugadores()" type="text" class="mb-3 border-purple-500 border-b" [(ngModel)]="players[$index].nombre">
                    <button (click)="eliminarJugador($index)" class="text-red-500 text-2xl px-2 py-1">
                        x
                    </button>
                </div>
            }
        </article>
        <button (click)="agregarJugador(`Jugador ${players.length + 1}`)" class="rounded-2xl bg-purple-600 text-gray-100 px-4 py-2 active:bg-purple-600">
            + Agregar Jugador
        </button>
    </section>
    <section class="mt-10">
        <h2 class="text-2xl">Impostores</h2>
        <article>
            <select class="bg-purple-600 text-gray-100 rounded-lg px-2 py-1" [(ngModel)]="impostores" (change)="storage.guardarImpostores(impostores)">
                @for(i of [1,2,3] ; track $index){
                    <option [value]="i" selected="{{impostores === 1}}">
                        {{i}}
                    </option>
                }
            </select>
        </article>
    </section>
</main>
