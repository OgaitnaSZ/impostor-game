<main class="p-4 flex flex-col justify-between h-full">
  <div class="w-full flex flex-col bg-indigo-950 p-2 rounded-lg">
    <button class="flex" routerLink="/menu"><span class="material-symbols-outlined"> arrow_back_ios </span>Volver</button>
    <h1 class="text-6xl text-center mb-4">El Impostor</h1>
    <a
      routerLink="players"
      routerLinkActive="text-gray-900 bg-gray-300"
      class="flex justify-between px-4 py-4 font-bold text-gray-100">
      <div class="flex gap-2">
        <span class="material-symbols-outlined">group</span>
        Jugadores
      </div>
      <div class="flex gap-2 opacity-50 font-extralight">
        {{ jugadores() || 0 }}
        <span class="material-symbols-outlined"> arrow_forward_ios </span>
      </div>
    </a>
  
    <a
      routerLink="categories"
      routerLinkActive="text-gray-900 bg-gray-300"
      class="flex justify-between px-4 py-4 font-bold text-gray-100">
      <div class="flex gap-2">
        <span class="material-symbols-outlined"> category </span>
        Categoría
      </div>
      <div class="flex gap-2 opacity-50 font-extralight">
        {{ categoria() || 'Sin Categoría' }}
        <span class="material-symbols-outlined"> arrow_forward_ios </span>
      </div>
    </a>
  
    <a
      routerLink="impostors"
      routerLinkActive="text-gray-900 bg-gray-300"
      class="flex justify-between px-4 py-4 font-bold text-gray-100">
        <div class="flex gap-2">
          <span class="material-symbols-outlined"> domino_mask </span>
          Impostores
        </div>
        <div class="flex gap-2 opacity-50 font-extralight">
          {{ impostores() || 0 }}
          <span class="material-symbols-outlined"> arrow_forward_ios </span>
        </div>
    </a>
  </div>

  <div class="h-full">
    <router-outlet></router-outlet>
  </div>
  
  <button
    [disabled]="comprobarSetupCompleto() === false"
    routerLink="/game"
    class="
      w-full mt-6 p-4 rounded-lg
      text-gray-100
      active:rounded-2xl bg-indigo-700
      disabled:opacity-50
      disabled:cursor-not-allowed
      disabled:bg-gray-500
      disabled:border-gray-500
    "
  >
    Empezar Partida
  </button>
</main>
