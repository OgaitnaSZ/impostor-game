<section class="text-center mt-10">
  <h2 class="text-2xl">Selecciona una Categoría</h2>
  <ul class="mt-5 flex flex-col overflow-y-auto h-90">
    @for(category of categories ; track $index){
      <li class="mb-3">
        <button [ngClass]="category === categoriaActual() ? 'bg-indigo-700 text-gray-100' : 'text-indigo-700' " (click)="guardarCategoria(category)" class="w-full border rounded-lg border-indigo-700 px-4 py-2">
          {{ category }}
        </button>
      </li>
    }
  </ul>
</section>
