<main class="text-center mt-10">
  <h2 class="text-2xl">Selecciona una Categoría</h2>
  <ul class="mt-5 flex flex-col justify-center items-center">
    @for(category of categories ; track $index){
      <li class="mb-3">
        <button [ngClass]="category === categoriaActual ? 'bg-purple-600 text-gray-100' : 'text-gray-900' " (click)="guardarCategoria(category)" class="border rounded-2xl border-purple-600  px-4 py-2">
          {{ category }}
        </button>
      </li>
    }
  </ul>
</main>
